name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run the behaviour tests
        run: node --test test/index.test.js
